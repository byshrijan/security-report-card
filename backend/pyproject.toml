[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dnspython>=2.9.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.147.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."] 
